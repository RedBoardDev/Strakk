server {
    listen 8743;

    # Docker internal DNS resolver — re-resolve upstream hostnames every 30s
    # so nginx picks up new container IPs after restarts without needing a reload.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_api http://nutrition-api:3000;

    # Only expose API routes and health check
    location /api/v1/ {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        client_max_body_size 20m;
    }

    location = /healthz {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
    }

    # Block everything else
    location / {
        return 403;
    }
}
