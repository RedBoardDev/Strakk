services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant.yaml:/qdrant/config/production.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nutrition-api:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - import_data:/app/import/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8743:8743"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nutrition-api:
        condition: service_healthy

  # One-shot sidecar: creates the Qdrant collection if it doesn't exist
  qdrant-init:
    image: curlimages/curl:latest
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c '
        curl -sf http://qdrant:6333/collections/food_catalog > /dev/null 2>&1 && echo "Collection already exists" && exit 0;
        curl -sf -X PUT http://qdrant:6333/collections/food_catalog \
          -H "Content-Type: application/json" \
          -d "{
            \"vectors\": { \"size\": 1536, \"distance\": \"Cosine\" },
            \"optimizers_config\": { \"indexing_threshold\": 20000 },
            \"hnsw_config\": { \"m\": 16, \"ef_construct\": 200 }
          }" && echo "Collection created"
      '

volumes:
  qdrant_data:
  import_data:
